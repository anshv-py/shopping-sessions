[package]
name = "sessions"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "sessions"
path = "src/main.rs"

[dependencies]
memmap2 = "0.9"
memchr = "2"
parquet = { version = "53", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
